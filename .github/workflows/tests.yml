name: tests

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and schema tests
        run: pytest -q
      - name: Recompute all tables and compare with results/
        run: python main.py --check
